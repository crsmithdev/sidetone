<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidetone</title>
<style>
  :root { color-scheme: dark; --bg:#0e1113; --fg:#e8e6e3; --dim:#8a9199; --line:#22282c; --live:#4ec9a7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,sans-serif;
         min-height:100dvh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { display:flex; align-items:center; gap:10px; padding:14px 0; border-bottom:1px solid var(--line); }
  #dot { width:10px; height:10px; border-radius:50%; background:#555; flex:none; }
  #dot.on { background:var(--live); box-shadow:0 0 10px var(--live); }
  #state { color:var(--dim); font-size:14px; }
  main { flex:1; overflow-y:auto; padding:12px 0; display:flex; flex-direction:column; gap:10px; }
  .line { max-width:90%; padding:9px 12px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .you { align-self:flex-end; background:#1d2a33; border-bottom-right-radius:4px; }
  .bridge { align-self:flex-start; background:#171c20; border-bottom-left-radius:4px; }
  .note { align-self:center; color:var(--dim); font-size:13px; background:none; padding:2px; }
  footer { border-top:1px solid var(--line); padding:12px 0; display:flex; gap:8px; }
  input, button { font:inherit; border-radius:10px; border:1px solid var(--line); padding:11px 13px; }
  input { flex:1; min-width:0; background:#12171a; color:var(--fg); }
  button { background:#1d2a33; color:var(--fg); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  /* big enough to hit in a car, without looking at it for long */
  #sound { display:none; margin:0; padding:18px; border:0; border-radius:0; width:100%;
           background:#7a3b2e; color:#fff; font-size:17px; font-weight:600; }
  #sound.show { display:block; }
  #pair { margin:auto; text-align:center; max-width:340px; }
  #pair p { color:var(--dim); font-size:14px; }
  .hidden { display:none !important; }
  /* A hard cut for the microphone, big enough to hit without looking, because
     the moment you want it is the moment you are driving. */
  #mic {
    appearance:none; font:inherit; font-size:15px; font-weight:600;
    background:#1d2a2f; color:var(--ink); border:1px solid #33454d;
    border-radius:8px; padding:12px 18px; min-height:48px; cursor:pointer;
    width:100%; margin-top:12px;
  }
  #mic[aria-pressed="true"] { background:#5a2a24; border-color:#8c4034; color:#ffd9d2; }
  #mic:active { transform:translateY(1px); }
  #mic:focus-visible { outline:2px solid #6bbf87; outline-offset:2px; }
  /* N.2.2 a passive indicator, always visible, so a slow network is never
     mistaken for a stalled agent */
  #net { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--dim); }
  #bars { display:flex; align-items:flex-end; gap:2px; height:12px; }
  #bars i { width:3px; background:currentColor; opacity:.25; border-radius:1px; }
  #bars i:nth-child(1){ height:4px } #bars i:nth-child(2){ height:8px } #bars i:nth-child(3){ height:12px }
  #net.excellent { color:#6bbf87 } #net.good { color:#6bbf87 }
  #net.poor { color:#d8a657 } #net.lost { color:#e07a5f }
  #net.excellent i, #net.good i:nth-child(-n+2), #net.poor i:nth-child(1) { opacity:1 }
  #net.lost i { opacity:.9 }
</style>
</head>
<body>
<header><span id="dot"></span><strong>Sidetone</strong><span id="state">not connected</span>
<span id="net" title="the connection, as the framework reports it"><span id="bars"><i></i><i></i><i></i></span><span id="netword">&mdash;</span></span></header>

<section id="pair">
  <h2>Pair this phone</h2>
  <p>The bridge printed a three-word code when it started. It is asked once; this phone remembers it after that.</p>
  <footer style="border:0">
    <input id="code" placeholder="amber-cedar-tide" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button id="go">Pair</button>
  </footer>
  <p id="pairError" style="color:#e0796b"></p>
</section>

<button id="sound">Tap to hear the bridge</button>
<main id="log" class="hidden"></main>
<button id="mic" type="button" hidden aria-pressed="false">Cut the microphone</button>
<footer id="bar" class="hidden">
  <input id="say" placeholder="or type it" autocomplete="off">
  <button id="send">Send</button>
  <button id="stop" title="end the turn">Stop</button>
</footer>

<script type="module">
import { Room, RoomEvent, Track } from "/livekit-client.mjs";

const $ = (id) => document.getElementById(id);
const log = $("log"), state = $("state"), dot = $("dot");
const KEY = "sidetone-credentials";
const sounds = [];

function start(element) {
  const played = element.play();
  if (!played) return;
  played.then(() => $("sound").classList.remove("show"))
        .catch(() => $("sound").classList.add("show"));
}

// the tap the browser was waiting for
$("sound").onclick = () => {
  for (const element of sounds) start(element);
  $("sound").classList.remove("show");
};

function line(text, kind) {
  const el = document.createElement("div");
  el.className = `line ${kind}`;
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// 14.7 the answer, a sentence at a time, ahead of the voice. The turn message
// that follows carries the whole of it and takes the growing line's place.
// Both name their answer: an interrupted answer sends no turn, and the next
// one used to grow on its line, above the words that came in between.
let growing = null;
let growingAnswer;
function sentence(text, answer) {
  if (growing && growingAnswer === answer) growing.textContent += ` ${text}`;
  else { growing = line(text, "bridge"); growingAnswer = answer; }
  log.scrollTop = log.scrollHeight;
}
function answered(text, answer) {
  if (growing && growingAnswer === answer) growing.textContent = text;
  else line(text, "bridge");
  growing = null;
}

$("go").onclick = async () => {
  const code = $("code").value.trim();
  if (!code) return;
  $("go").disabled = true;
  try {
    const response = await fetch("/pair", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code }) });
    if (!response.ok) throw new Error((await response.json()).error ?? "pairing failed");
    const credentials = await response.json();
    // 12.2 kept, so 12.4 does not ask again
    localStorage.setItem(KEY, JSON.stringify(credentials));
    await connect(credentials);
  } catch (error) {
    $("pairError").textContent = error.message;
    $("go").disabled = false;
  }
};

async function connect({ url, token }) {
  $("pair").classList.add("hidden");
  log.classList.remove("hidden");
  $("bar").classList.remove("hidden");
  state.textContent = "connecting";

  // 4.2 the echo cancellation is the framework's, not ours. It is what lets the
  // microphone stay open while the bridge speaks, which is 11.1 to 11.3.
  const room = new Room({
    adaptiveStream: true,
    audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    // Cutting the microphone releases the device, so the phone's own recording
    // indicator goes out. Muting a track that keeps running leaves the light on
    // and asks Chris to trust a button over his own phone.
    //
    // This belongs in publishDefaults. Set at the top level of the room options
    // it is silently ignored, and the track reads "live" after a cut.
    publishDefaults: { stopMicTrackOnMute: true },
  });

  room.on(RoomEvent.Connected, () => { state.textContent = "listening"; dot.classList.add("on"); });
  room.on(RoomEvent.Disconnected, () => { state.textContent = "disconnected"; dot.classList.remove("on"); });
  // 14.2 LiveKit reconnects the transport; the bridge keeps the session behind it
  room.on(RoomEvent.Reconnecting, () => { state.textContent = "reconnecting"; dot.classList.remove("on"); });
  room.on(RoomEvent.Reconnected, () => { state.textContent = "listening"; dot.classList.add("on"); });

  // N.1.4 the phone reads its own uplink and tells the bridge, because the
  // bridge cannot see this end from where it sits, and in a car this is the
  // end that goes first.
  const net = document.getElementById("net");
  const netword = document.getElementById("netword");
  let lastQuality = null;
  room.on(RoomEvent.ConnectionQualityChanged, (quality, participant) => {
    if (participant?.identity !== room.localParticipant?.identity) return;
    const seen = String(quality ?? "").toLowerCase();
    net.className = seen;
    netword.textContent = seen || "\u2014";
    if (seen === lastQuality) return;
    lastQuality = seen;
    tell({ kind: "quality", quality: seen });
  });

  room.on(RoomEvent.TrackSubscribed, (track) => {
    if (track.kind !== Track.Kind.Audio) return;
    const element = track.attach();
    element.autoplay = true;
    element.playsInline = true;
    document.body.append(element);
    sounds.push(element);
    // A phone that already has a token connects with no tap at all, and a
    // browser refuses to make a sound it was not asked for. Nothing errors:
    // the reply arrives, the transcript fills in, and the car stays silent.
    start(element);
  });

  // 4.3 the control channel, and 14.7 the light transcript that is also the audit trail
  room.on(RoomEvent.DataReceived, (payload) => {
    let message;
    try { message = JSON.parse(new TextDecoder().decode(payload)); } catch { return; }
    // 14.8 the turns that happened while this client was away
    if (message.kind === "history") {
      if (log.dataset.filled) return;
      log.dataset.filled = "1";
      const turns = message.turns ?? [];
      if (turns.length === 0) return;
      // say plainly that this is older, or it reads as the conversation in progress
      line("earlier", "note");
      for (const past of turns) {
        if (past.kind === "heard") line(past.text, "you");
        else if (past.kind === "turn") line(past.text, "bridge");
      }
      line("now", "note");
      return;
    }
    // 4.3 the bridge says what a client has to say back to it, so the Stop
    // button is never a phrase the wake word has moved away from
    if (message.kind === "protocol") { endTurn = message.endTurn; $("stop").disabled = false; return; }
    if (message.kind === "heard") line(message.text, "you");
    else if (message.kind === "sentence") sentence(message.text, message.answer);
    else if (message.kind === "turn") answered(message.text, message.answer);
    else if (message.kind === "narration") line(message.text, "note");
    else if (message.kind === "error") line(message.text, "note");
    // 18.9 the app renews its own microphone track on this; the page does not
    else if (message.kind === "rejoin") return;
    // 14.9 the app shows a bubble for each block of an answer. The page keeps its
    // one line for each answer, grown by sentences, so it ignores the blocks.
    else if (message.kind === "blockStart" || message.kind === "delta" || message.kind === "blockEnd") return;
    // a kind this page does not know is the two ends drifting apart. Say so
    // rather than dropping it, which is how it stayed hidden before.
    else line(`(unknown message: ${message.kind})`, "note");
  });

  await room.connect(url, token);
  await room.localParticipant.setMicrophoneEnabled(true);
  window.__room = room;
  wireMic(room);
  keepAwake();
}

/**
 * Cut the microphone, properly. setMicrophoneEnabled(false) unpublishes the
 * track rather than muting a stream that keeps flowing, so nothing reaches the
 * bridge at all and the indicator on the phone is the truth.
 *
 * The bridge is told as well, so it drops whatever it had half recorded. A
 * paused microphone that hands over the first half of a sentence when it comes
 * back is worse than no pause.
 */
function wireMic(room) {
  const button = document.getElementById("mic");
  let off = false;
  const paint = () => {
    button.setAttribute("aria-pressed", String(off));
    button.textContent = off ? "Microphone off — tap to resume" : "Cut the microphone";
  };
  paint();
  button.hidden = false;
  button.addEventListener("click", async () => {
    off = !off;
    paint();
    button.disabled = true;
    try {
      await room.localParticipant.setMicrophoneEnabled(!off);
      tell({ kind: "mic", on: !off });
      line(off ? "microphone off" : "microphone on", "note");
    } finally { button.disabled = false; }
  });
}

// The mic only stays open while the screen is on. The lock releases whenever
// the tab leaves the foreground, so it is re-requested on return.
let wakeLock = null;
async function keepAwake() {
  if (!("wakeLock" in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request("screen"); }
  catch { /* not fatal: the screen may just dim on its own */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && window.__room) keepAwake();
});

function tell(value) {
  const room = window.__room;
  if (!room) return;
  room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify(value)), { reliable: true });
}

$("send").onclick = () => {
  const text = $("say").value.trim();
  if (!text) return;
  $("say").value = "";
  tell({ kind: "said", text });
};
$("say").addEventListener("keydown", (event) => { if (event.key === "Enter") $("send").click(); });
// 9.4.8 by hand, for a car that is too loud to be heard in. The phrase comes
// from the bridge, which owns the wake word.
let endTurn = "";
$("stop").disabled = true;
$("stop").onclick = () => { if (endTurn) tell({ kind: "said", text: endTurn }); };

const saved = localStorage.getItem(KEY);
// 12.4 a token that is refused is worth throwing away. Anything else -- the
// tunnel down, livekit restarting, no signal in a tunnel -- is not, and
// clearing it sent the phone back to a three-word code that has to be read off
// the machine. Reloading into the same failure looped.
//
// "invalid API key" is what livekit says about a token it cannot verify, which
// is the case after the keys are rewritten. It reads like a fault on the
// machine and it is a refusal, measured 2026-09-17.
// The message and the reason are both read: livekit puts the text in the
// message and a number in the reason, and String(1) matched nothing.
const refused = (error) => {
  const reason = `${error?.message ?? ""} ${error?.reason ?? ""} ${error ?? ""}`;
  return /unauthor|invalid token|invalid api key|expired|permission|denied|403|401/i.test(reason);
};
if (saved) connect(JSON.parse(saved)).catch((error) => {
  if (!refused(error)) {
    // connect() hid the pairing panel on its way in; the message lives there
    $("pair").classList.remove("hidden");
    $("pairError").textContent = `cannot reach the bridge: ${error?.message ?? error}. Retrying.`;
    setTimeout(() => location.reload(), 5000);
    return;
  }
  localStorage.removeItem(KEY);
  location.reload();
});
</script>
</body>
</html>
